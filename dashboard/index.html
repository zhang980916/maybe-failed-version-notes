<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw A-Share Research Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050608;
      --panel: rgba(18, 22, 30, 0.82);
      --line: rgba(210, 220, 235, 0.13);
      --text: #eef2ec;
      --muted: #9aa3a0;
      --gold: #d2b86f;
      --green: #8ce0a8;
      --red: #ff827d;
      --violet: #9a8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 80% 10%, rgba(154, 140, 255, 0.18), transparent 34%),
        radial-gradient(circle at 24% 70%, rgba(210, 184, 111, 0.14), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 40px 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 5vw, 68px);
      line-height: 0.95;
      letter-spacing: 0;
    }
    p { color: var(--muted); margin: 0; }
    .status {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--green);
      font-family: Consolas, monospace;
      white-space: nowrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }
    .metric, .card, .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
    }
    .metric { padding: 16px; }
    .metric small {
      color: var(--muted);
      display: block;
      margin-bottom: 10px;
    }
    .metric strong {
      font-size: 28px;
      color: var(--gold);
    }
    .panel { padding: 18px; margin-bottom: 18px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .card { padding: 14px; min-height: 160px; }
    .rank {
      color: var(--gold);
      font-family: Consolas, monospace;
      font-size: 13px;
    }
    .code {
      display: block;
      font-family: Consolas, monospace;
      margin: 16px 0 8px;
      color: var(--violet);
    }
    .name {
      display: block;
      font-weight: 700;
      min-height: 42px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }
    th { color: var(--muted); font-weight: 600; }
    @media (max-width: 900px) {
      header, .grid, .cards { grid-template-columns: 1fr; display: grid; }
      .status { white-space: normal; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Signal Field</h1>
        <p>Read-only research dashboard powered by sanitized mock artifacts.</p>
      </div>
      <div class="status" id="status">loading</div>
    </header>

    <section class="grid" id="metrics"></section>

    <section class="panel">
      <h2>Top Candidates</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section class="panel">
      <h2>Recent Experiments</h2>
      <table>
        <thead><tr><th>ID</th><th>Type</th><th>Name</th><th>Status</th></tr></thead>
        <tbody id="experiments"></tbody>
      </table>
    </section>
  </main>

  <script>
    const fmt = (value) => typeof value === "number" ? value.toLocaleString("en-US") : value;

    async function load() {
      const response = await fetch("./dashboard_data.json");
      const data = await response.json();
      document.querySelector("#status").textContent = `${data.mode} | ${data.generated_at}`;

      const summary = data.summary;
      document.querySelector("#metrics").innerHTML = [
        ["Active factors", summary.active_factor_count],
        ["Experiments", summary.experiment_count],
        ["Top candidates", summary.top_candidate_count],
        ["Categories", Object.keys(summary.factor_categories).length],
      ].map(([label, value]) => `<article class="metric"><small>${label}</small><strong>${fmt(value)}</strong></article>`).join("");

      document.querySelector("#cards").innerHTML = data.top5.map((item) => `
        <article class="card">
          <span class="rank">#${item.rank}</span>
          <span class="code">${item.code}</span>
          <span class="name">${item.name}</span>
          <div class="meta"><span>${item.industry}</span><span>${item.score}</span></div>
        </article>
      `).join("");

      document.querySelector("#experiments").innerHTML = data.recent_experiments.map((item) => `
        <tr>
          <td>${item.experiment_id || ""}</td>
          <td>${item.type || ""}</td>
          <td>${item.name || ""}</td>
          <td>${item.status || ""}</td>
        </tr>
      `).join("");
    }

    load().catch((error) => {
      document.querySelector("#status").textContent = `error: ${error.message}`;
    });
  </script>
</body>
</html>
